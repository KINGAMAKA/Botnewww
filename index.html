<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMAKA AI</title>
<style>
  :root {
    --bg: #000;
    --panel: #1c1c1e;
    --panel-2: #2a2a2d;
    --gold: #d4af37;
    --text: #f2efe6;
    --muted: #9a968a;
    --danger: #e0705f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--gold);
  }
  h1 {
    margin: 0;
    font: 700 22px/1 Georgia, "Times New Roman", serif;
    letter-spacing: 0.04em;
    color: var(--gold);
  }
  .tools { display: flex; gap: 8px; }
  .tools button {
    background: none;
    color: var(--muted);
    border: 1px solid var(--panel-2);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
  }
  .tools button[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .user { align-self: flex-end; background: var(--gold); color: #000; border-bottom-right-radius: 3px; }
  .bot { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 3px; }
  .err { align-self: flex-start; background: var(--panel); color: var(--danger); border: 1px solid var(--danger); }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 24em; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--panel-2);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-2);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    max-height: 120px;
  }
  textarea:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  form button {
    border: 0;
    border-radius: 10px;
    padding: 0 16px;
    font: 600 15px system-ui, sans-serif;
  }
  #send { background: var(--gold); color: #000; }
  #send:disabled { opacity: 0.5; }
  #mic { background: var(--panel); color: var(--text); border: 1px solid var(--panel-2); }
  #mic[aria-pressed="true"] { color: #000; background: var(--gold); }
</style>
</head>
<body>
<header>
  <h1>AMAKA AI</h1>
  <div class="tools">
    <button id="speak" type="button" aria-pressed="false">Read aloud</button>
    <button id="clear" type="button">Clear chat</button>
  </div>
</header>

<main id="log" aria-live="polite"></main>

<form id="form">
  <button id="mic" type="button" aria-pressed="false" aria-label="Dictate">Mic</button>
  <textarea id="input" rows="1" placeholder="Ask AMAKA AI anything" aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
(function () {
  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var micBtn = document.getElementById('mic');
  var speakBtn = document.getElementById('speak');
  var clearBtn = document.getElementById('clear');

  var history = load('amaka_history', []);
  var speakOn = load('amaka_speak', false);

  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function addBubble(text, cls) {
    var empty = log.querySelector('.empty');
    if (empty) empty.remove();
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function showEmpty() {
    var d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'Type or tap Mic to dictate. Your chat is saved on this phone.';
    log.appendChild(d);
  }

  function render() {
    log.innerHTML = '';
    if (!history.length) showEmpty();
    history.forEach(function (m) { addBubble(m.content, m.role === 'user' ? 'user' : 'bot'); });
  }

  function speak(text) {
    if (!speakOn || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB';
    window.speechSynthesis.speak(u);
  }

  async function send(text) {
    history.push({ role: 'user', content: text });
    save('amaka_history', history);
    addBubble(text, 'user');
    var wait = addBubble('Thinking...', 'bot');
    sendBtn.disabled = true;
    try {
      var r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history.slice(-20) })
      });
      var data = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(data.error || ('Server error ' + r.status));
      wait.textContent = data.reply;
      history.push({ role: 'assistant', content: data.reply });
      save('amaka_history', history);
      speak(data.reply);
    } catch (e) {
      wait.className = 'msg err';
      wait.textContent = 'Failed: ' + e.message;
      history.pop(); // drop the unanswered message so retrying is clean
      save('amaka_history', history);
    } finally {
      sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var t = input.value.trim();
    if (!t || sendBtn.disabled) return;
    input.value = '';
    input.style.height = 'auto';
    send(t);
  });

  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  clearBtn.addEventListener('click', function () {
    history = [];
    save('amaka_history', history);
    window.speechSynthesis && window.speechSynthesis.cancel();
    render();
  });

  function paintSpeak() {
    speakBtn.setAttribute('aria-pressed', String(speakOn));
    speakBtn.textContent = speakOn ? 'Reading aloud' : 'Read aloud';
  }
  speakBtn.addEventListener('click', function () {
    speakOn = !speakOn;
    save('amaka_speak', speakOn);
    if (!speakOn && window.speechSynthesis) window.speechSynthesis.cancel();
    paintSpeak();
  });

  // Dictation (works in Chrome on Android)
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.hidden = true;
  } else {
    var rec = new SR();
    rec.lang = 'en-GB';
    rec.interimResults = false;
    rec.onresult = function (ev) {
      var t = ev.results[0][0].transcript;
      input.value = (input.value ? input.value + ' ' : '') + t;
      input.dispatchEvent(new Event('input'));
    };
    rec.onend = function () { micBtn.setAttribute('aria-pressed', 'false'); };
    rec.onerror = function () { micBtn.setAttribute('aria-pressed', 'false'); };
    micBtn.addEventListener('click', function () {
      if (micBtn.getAttribute('aria-pressed') === 'true') { rec.stop(); return; }
      micBtn.setAttribute('aria-pressed', 'true');
      try { rec.start(); } catch (e) { micBtn.setAttribute('aria-pressed', 'false'); }
    });
  }

  paintSpeak();
  render();
})();
</script>
</body>
</html>
